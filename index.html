<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>دليل الحرفيين - منصة الحرفيين الموثوقين</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 50%, #2c3e50 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(26, 37, 47, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .logo i {
            background: none;
            -webkit-text-fill-color: #f39c12;
            margin-left: 8px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .menu-btn:hover {
            transform: scale(1.05);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 320px;
            height: 100%;
            background: linear-gradient(180deg, #1a252f 0%, #2c3e50 100%);
            color: white;
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1100;
            box-shadow: -5px 0 30px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar .user-info {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(243, 156, 18, 0.3);
            margin-bottom: 10px;
        }

        .sidebar .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            overflow: hidden;
        }

        .sidebar .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar .user-avatar i {
            font-size: 3rem;
            color: white;
        }

        .sidebar .user-info h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .sidebar .user-info p {
            font-size: 0.8rem;
            color: #bdc3c7;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.3s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar a i {
            margin-left: 12px;
            width: 25px;
        }

        .sidebar a:hover {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            padding-right: 30px;
        }

        .close-sidebar {
            position: absolute;
            top: 15px;
            left: 15px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .close-sidebar:hover {
            background: rgba(243, 156, 18, 0.3);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1050;
            display: none;
            transition: 0.3s;
        }

        .overlay.show {
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            background: white;
        }

        .card-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            overflow: hidden;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-avatar i {
            font-size: 2.5rem;
            color: white;
        }

        .card h3 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .rating {
            color: #f39c12;
            margin: 8px 0;
            font-weight: 600;
        }

        .badge {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
        }

        .location-badge {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 5px;
        }

        .profile-info {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .profile-avatar:hover .avatar-overlay {
            opacity: 1;
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            border-radius: 50%;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar i {
            font-size: 3rem;
            color: white;
        }

        .input-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        .input-group i:not(.toggle-password) {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
        }
        
        /* تنسيق خاص لحقل كلمة المرور مع أيقونة العين */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        
        .password-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: 0.3s;
            background: #fafafa;
        }
        
        .password-wrapper input:focus {
            outline: none;
            border-color: #3498db;
            background: white;
        }
        
        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #95a5a6;
            z-index: 2;
            background: transparent;
            font-size: 1rem;
            transition: color 0.2s;
        }
        
        .toggle-password:hover {
            color: #3498db;
        }
        
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: 0.3s;
            background: #fafafa;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #3498db;
            background: white;
        }

        .whatsapp-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            direction: ltr;
        }
        
        .whatsapp-wrapper select {
            width: 100px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #fafafa;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .whatsapp-wrapper input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #fafafa;
        }

        .review-section {
            background: linear-gradient(135deg, #f8f9fa, #fff);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            border: 1px solid #eee;
        }
        
        .review-section h4 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .rating-input {
            margin-bottom: 1rem;
        }
        
        .rating-input label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .comment-input textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.9rem;
            resize: vertical;
            background: white;
        }
        
        .submit-review-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            width: 100%;
            padding: 12px;
            margin-top: 1rem;
            font-size: 1rem;
        }

        button {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            margin: 4px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
        }

        .delete-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .accept-btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }

        .reject-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .call-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1200;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .image-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            overflow: hidden;
            border: 3px solid #f39c12;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            margin: 10px 0;
        }

        .sweet-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 1.5rem 2rem;
            text-align: center;
            z-index: 1300;
            animation: sweetFadeIn 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        @keyframes sweetFadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .flex-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .back-button {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            transition: 0.3s;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(-5px);
        }

        .notification-bell {
            position: relative;
            cursor: pointer;
            margin-left: 12px;
        }

        .notification-bell i {
            font-size: 1.3rem;
            transition: 0.3s;
        }

        .notification-bell i:hover {
            color: #f39c12;
        }

        .notification-badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.6rem;
        }

        .request-item, .comment-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-right: 4px solid #f39c12;
            transition: 0.3s;
        }

        .request-item:hover, .comment-item:hover {
            transform: translateX(-3px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .section-title {
            margin: 1rem 0 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #f39c12;
            color: #2c3e50;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 1rem;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .comments-container {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        
        .comment-user {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .comment-rating {
            color: #f39c12;
        }
        
        .comment-date {
            font-size: 0.7rem;
            color: #95a5a6;
        }
        
        .comment-text {
            color: #555;
            margin-top: 8px;
        }

        .time-remaining {
            font-size: 0.7rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        .location-group {
            background: #f0f7ff;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #d4e6f1;
        }
        
        .location-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .location-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.9rem;
            background: white;
            cursor: pointer;
        }
        
        /* تنسيق خانة تذكرني */
        .remember-me {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin: 0.8rem 0 1.2rem;
            gap: 8px;
            cursor: pointer;
        }
        
        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }
        
        .remember-me label {
            color: #2c3e50;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .profile-header { flex-direction: column; text-align: center; }
            .cards-grid { gap: 1rem; }
            .container { padding: 0.8rem; }
            .whatsapp-wrapper { flex-direction: row; }
            .whatsapp-wrapper select { width: 90px; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo" onclick="goToHome()"><i class="fas fa-tools"></i> دليل الحرفيين</div>

        <div class="notification-bell" id="notificationBell" style="display: none;">

</div>

<div class="sidebar" id="sidebar">
    <div class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></div>

    <a href="#" id="sideHome"><i class="fas fa-home"></i> الرئيسية</a>

</div>
<div class="overlay" id="overlay"></div>
<div id="appContent"></div>

    function showMessage(message, isError = false) {
        const existing = document.querySelector('.sweet-message');
        if (existing) existing.remove();
        const msgDiv = document.createElement('div');
        msgDiv.className = 'sweet-message';
        msgDiv.innerHTML = `<i class="fas ${isError ? 'fa-times-circle' : 'fa-check-circle'}" style="color: ${isError ? '#e74c3c' : '#27ae60'}; font-size: 2rem;"></i><p>${message}</p>`;
        document.body.appendChild(msgDiv);
        setTimeout(() => msgDiv.remove(), 2000);
    }

    function showConfirm(title, message, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.display = 'flex';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>${title}</h3>

        document.getElementById('confirmYes').onclick = () => { onConfirm(); modal.remove(); };

    function updateCenterOptions(governorateSelectId, centerSelectId, selectedCenter = '') {
        const governorate = document.getElementById(governorateSelectId).value;
        const centerSelect = document.getElementById(centerSelectId);
        if (governorate && egyptGovernorates[governorate]) {
            centerSelect.innerHTML = '<option value="">اختر المركز</option>' + 
                egyptGovernorates[governorate].map(center => `<option value="${center}" ${selectedCenter === center ? 'selected' : ''}>${center}</option>`).join('');

        } else {
            centerSelect.innerHTML = '<option value="">اختر المحافظة أولاً</option>';

    async function cleanupOldRequests() {
        const now = Date.now();
        const fiveMinutes = 5 * 60 * 1000;
        const twentyFourHours = 24 * 60 * 60 * 1000;
        
        const snap = await db.ref('requests').once('value');
        const updates = {};
        
        snap.forEach(snapshot => {
            const req = snapshot.val();
            const requestId = snapshot.key;
            const completedAt = req.completedAt || req.rejectedAt;
            
            if (completedAt) {
                const timeDiff = now - completedAt;
                
                if (req.craftsmanId === currentUser?.username && (req.status === 'completed' || req.status === 'rejected')) {
                    if (timeDiff >= fiveMinutes) {
                        updates[requestId] = null;
                    }
                }
                else if (req.clientId === currentUser?.username && (req.status === 'completed' || req.status === 'rejected')) {
                    if (timeDiff >= twentyFourHours) {
                        updates[requestId] = null;
                    }
                }
            }
        });
        
        if (Object.keys(updates).length > 0) {
            await db.ref('requests').update(updates);
        }
    }

    function startCleanupInterval() {
        if (cleanupInterval) clearInterval(cleanupInterval);
        cleanupInterval = setInterval(async () => {
            if (currentUser) {
                await cleanupOldRequests();
                if (currentUser.type === 'client') {
                    if (document.querySelector('#reqList')) renderClientRequests();
                } else if (currentUser.type === 'craftsman') {
                    if (document.querySelector('#reqList')) renderCraftsmanRequests();
                }
            }
        }, 60000);
    }

    // دوال لحفظ واسترجاع الجلسة (تذكرني)
    function saveSession(username, password) {
        localStorage.setItem('rememberedUser', username);
        localStorage.setItem('rememberedPass', password);
    }
    
    function clearSession() {
        localStorage.removeItem('rememberedUser');
        localStorage.removeItem('rememberedPass');
    }
    
    function getSavedSession() {
        return {
            username: localStorage.getItem('rememberedUser'),
            password: localStorage.getItem('rememberedPass')
        };
    }

    async function loginUser(username, password, rememberMe = false) {
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
        
        if (snapshot.exists()) {
            let userData = null;
            snapshot.forEach(child => {
                userData = child.val();
            });
            
            if (userData && userData.password === password) {
                currentUser = { username: username, ...userData };
                currentUserType = currentUser.type;
                
                // حفظ الجلسة إذا تم اختيار تذكرني
                if (rememberMe) {
                    saveSession(username, password);
                } else {
                    clearSession();
                }
                
                updateUI();
                renderPage();
                startNotifications();
                startCleanupInterval();
                showMessage(`مرحباً ${username}! تم تسجيل الدخول بنجاح`);
                return true;
            } else {
                showMessage('كلمة المرور غير صحيحة', true);
                return false;
            }
        } else {
            showMessage('اسم المستخدم غير موجود', true);
            return false;
        }
    }

    async function registerUser(username, password, type, profession, phone, whatsappCode, whatsappNumber, governorate, center) {
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
        
        if (snapshot.exists()) {
            showMessage('اسم المستخدم موجود بالفعل', true);
            return false;
        }
        
        const fullWhatsapp = whatsappCode + whatsappNumber;
        
        const userData = {
            username: username,
            password: password,
            type: type,
            avatar: '',
            ratingSum: 0,
            ratingCount: 0,
            avgRating: 0,
            comments: [],
            bio: type === 'craftsman' ? 'حرفي محترف جاهز لخدمتك' : 'عميل جديد في دليل الحرفيين',
            createdAt: new Date().toISOString(),
            governorate: governorate,
            center: center
        };
        
        if (type === 'craftsman') {
            if (!profession || !phone) {
                showMessage('المهنة ورقم الهاتف مطلوبان للحرفي', true);
                return false;
            }
            userData.profession = profession;
            userData.phone = phone;
            userData.whatsappCode = whatsappCode;
            userData.whatsappNumber = whatsappNumber;
            userData.whatsapp = fullWhatsapp;
        }
        
        await db.ref('users/' + username).set(userData);
        currentUser = { username: username, ...userData };
        currentUserType = type;
        updateUI();
        renderPage();
        startNotifications();
        startCleanupInterval();
        showMessage(`تم إنشاء الحساب بنجاح! مرحباً ${username}`);
        return true;
    }

        if (!currentUser || currentUser.type !== 'craftsman') return;
        const snap = await db.ref('requests').once('value');
        let count = 0;
        snap.forEach(s => { if (s.val().craftsmanId === currentUser.username && s.val().status === 'pending') count++; });
        document.getElementById('notificationCount').innerText = count;
    }

    async function getAllCraftsmenByCenter(center) {
        const snap = await db.ref('users').once('value');
        const craftsmen = [];
        snap.forEach(child => { 
            const user = child.val();
            if (user.type === 'craftsman' && user.center === center) {
                craftsmen.push({ username: child.key, ...user });
            }
        });
        return craftsmen;
    }

        const snap = await db.ref('users/' + craftId).once('value');
        const craft = snap.val();
        if (!craft) return;

    function openAvatarModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.display = 'flex';
        modal.innerHTML = `
            <div class="modal-content">
                <h3><i class="fas fa-camera"></i> تغيير الصورة الشخصية</h3>
                <div class="image-preview" id="previewContainer"><i class="fas fa-user-circle" style="font-size: 5rem; color: #ccc;"></i></div>
                <label class="upload-btn"><i class="fas fa-cloud-upload-alt"></i> اختر صورة من الجهاز <input type="file" id="avatarFile" accept="image/*" class="file-input"></label>
                <p style="font-size: 0.7rem; color: #7f8c8d;">يدعم الصور JPG, PNG, GIF (حد أقصى 2MB)</p>
                <div class="modal-buttons"><button id="saveAvatarBtn" class="accept-btn">حفظ الصورة</button><button id="closeAvatarBtn" class="reject-btn">إلغاء</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        
        let selectedBase64 = null;
        document.getElementById('avatarFile').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) { showMessage('الصورة كبيرة جداً (حد أقصى 2MB)', true); return; }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    selectedBase64 = ev.target.result;
                    const preview = document.getElementById('previewContainer');
                    preview.innerHTML = `<img src="${selectedBase64}" style="width:100%;height:100%;object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('saveAvatarBtn').onclick = async () => {
            if (selectedBase64) {
                await db.ref('users/' + currentUser.username).update({ avatar: selectedBase64 });
                currentUser.avatar = selectedBase64;
                updateUI();
                showMessage('تم تحديث الصورة الشخصية بنجاح!');
                modal.remove();
                renderProfile();
            } else { showMessage('الرجاء اختيار صورة أولاً', true); }
        };
        document.getElementById('closeAvatarBtn').onclick = () => modal.remove();
    }

    async function renderCraftsmanRequests() {

        if (requests.length === 0) { container.innerHTML = '<p style="text-align: center;">لا توجد طلبات حالياً</p>'; return; }

        const fiveMinutes = 5 * 60 * 1000;
        
        const pending = requests.filter(r => r.status === 'pending');

    function openRatingModal(requestId, craftsmanId) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.display = 'flex';
        modal.innerHTML = `
            <div class="modal-content">
                <h3><i class="fas fa-star"></i> تقييم الخدمة</h3>
                <select id="rateStars">
                    <option value="5">★★★★★ (ممتاز)</option>
                    <option value="4">★★★★☆ (جيد جداً)</option>
                    <option value="3">★★★☆☆ (جيد)</option>
                    <option value="2">★★☆☆☆ (مقبول)</option>
                    <option value="1">★☆☆☆☆ (سيئ)</option>
                </select>
                <textarea id="rateComment" placeholder="تعليقك على الخدمة..." rows="3"></textarea>
                <div class="modal-buttons"><button id="submitRateBtn" class="accept-btn">إرسال التقييم</button><button id="cancelRateBtn" class="reject-btn">إلغاء</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('submitRateBtn').onclick = async () => {
            const stars = parseInt(document.getElementById('rateStars').value);
            const comment = document.getElementById('rateComment').value;
            const craft = await db.ref('users/' + craftsmanId).once('value');
            const c = craft.val();
            await db.ref('users/' + craftsmanId).update({
                ratingSum: (c.ratingSum||0) + stars,
                ratingCount: (c.ratingCount||0) + 1,
                avgRating: ((c.ratingSum||0) + stars) / ((c.ratingCount||0) + 1),
                comments: [...(c.comments||[]), { username: currentUser.username, rating: stars, comment, date: new Date().toISOString() }]
            });
            await db.ref('requests/' + requestId).update({ rated: true });
            showMessage('شكراً لتقييمك!');
            modal.remove();
            renderClientRequests();
        };
        document.getElementById('cancelRateBtn').onclick = () => modal.remove();
    }

    function openRejectModal(requestId) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.display = 'flex';
        modal.innerHTML = `
            <div class="modal-content">
                <h3><i class="fas fa-ban"></i> رفض الطلب</h3>
                <textarea id="rejectReason" placeholder="سبب الرفض..." rows="4"></textarea>
                <div class="modal-buttons"><button id="confirmRejectBtn" class="accept-btn">تأكيد الرفض</button><button id="cancelRejectBtn" class="reject-btn">إلغاء</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('confirmRejectBtn').onclick = async () => {
            const reason = document.getElementById('rejectReason').value;
            if (!reason) { showMessage('الرجاء كتابة سبب الرفض', true); return; }
            const rejectedAt = Date.now();
            await db.ref('requests/' + requestId).update({ status: 'rejected', rejectReason: reason, rejectedAt: rejectedAt });
            showMessage('تم رفض الطلب وإرسال السبب للعميل');
            modal.remove();
            renderCraftsmanRequests();
            updateNotificationCount();
        };
        document.getElementById('cancelRejectBtn').onclick = () => modal.remove();
    }

    function closeSidebar() { 
        document.getElementById('sidebar').classList.remove('open'); 
        document.getElementById('overlay').classList.remove('show');
    }
    
    function openSidebar() { 
        if (currentUser) { 
            document.getElementById('sidebar').classList.add('open'); 
            document.getElementById('overlay').classList.add('show');
        } 
    }
    
    window.goToHome = () => { renderPage(); closeSidebar(); };
    
    document.getElementById('menuBtn').onclick = openSidebar;
    document.getElementById('closeSidebar').onclick = closeSidebar;
    document.getElementById('overlay').onclick = closeSidebar;
    document.getElementById('notificationBell').onclick = () => { closeSidebar(); if (currentUser?.type === 'craftsman') renderCraftsmanRequests(); };
    document.getElementById('sideHome').onclick = (e) => { e.preventDefault(); closeSidebar(); renderPage(); };
    document.getElementById('sideProfile').onclick = (e) => { e.preventDefault(); closeSidebar(); renderProfile(); };
    document.getElementById('sideRequests').onclick = (e) => {
        e.preventDefault(); closeSidebar();
        if (currentUser?.type === 'client') renderClientRequests();
        else if (currentUser?.type === 'craftsman') renderCraftsmanRequests();
    };
    document.getElementById('sideLogout').onclick = (e) => { e.preventDefault(); closeSidebar(); logout(); };

    showAuthScreen();
</script>
</body>
